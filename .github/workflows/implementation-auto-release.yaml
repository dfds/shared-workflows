name: Auto release on merge (Implementation)

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"
      - "renovate.json"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-release:
    uses: ./.github/workflows/automation-auto-release.yml
