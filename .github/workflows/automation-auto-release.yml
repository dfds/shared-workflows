name: Create repository release

on:
  workflow_call:
    inputs:
      tag_prefix:
        required: false
        type: string
        default: ""
    outputs:
      semver:
        description: "The semantic version of the release"
        value: ${{ jobs.auto-release.outputs.semver }}

jobs:
  auto-release:
    runs-on: ubuntu-latest
    env:
      # If this release should trigger another workflow the `GITHUB_TOKEN`
      # secret must be overriden with the organization secret `GH_RELEASE`:
      # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
      GITHUB_TOKEN: ${{ secrets.GH_RELEASE || secrets.GITHUB_TOKEN }}
    outputs:
      semver: ${{ steps.auto-release-id.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_RELEASE || secrets.GITHUB_TOKEN }}
      - uses: rymndhng/release-on-push-action@v0.28.0
        id: auto-release-id
        with:
          bump_version_scheme: patch
          tag_prefix: ${{ inputs.tag_prefix }}
      - name: Update version aliases
        if: steps.auto-release-id.outputs.tag_name != ''
        env:
          RELEASE_TAG: ${{ steps.auto-release-id.outputs.tag_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          if [[ "$RELEASE_TAG" != "$TAG_PREFIX"* ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not start with the configured prefix '$TAG_PREFIX'"
            exit 1
          fi

          version="${RELEASE_TAG#"$TAG_PREFIX"}"
          if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            major="${TAG_PREFIX}${BASH_REMATCH[1]}"
            minor="${major}.${BASH_REMATCH[2]}"
          else
            echo "::error::Release tag '$RELEASE_TAG' is not a stable semantic version with the configured prefix"
            exit 1
          fi

          git tag --force "$major" "$GITHUB_SHA"
          git tag --force "$minor" "$GITHUB_SHA"
          git push --atomic --force origin "refs/tags/$major" "refs/tags/$minor"
