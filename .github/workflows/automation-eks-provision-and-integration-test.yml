name: EKS provision and integration test

on:
  workflow_call:
    inputs:
      cluster-name:
        description: 'Cluster name, e.g. diffie or staging-hellman. Drives the node-group/ASG waits, the kubeconfig path and the job name.'
        required: true
        type: string
      account-dir:
        description: 'Terragrunt account directory in the calling repo, e.g. hydrogen-account or staging-oxygen-account.'
        required: true
        type: string
      prime-role-arn:
        description: 'ARN of the Prime role to assume when running the node-group/ASG wait scripts.'
        required: true
        type: string
      integration-dns-zone:
        description: 'DNS zone passed to the integration tests as INTEGRATION_DNS_ZONE.'
        required: true
        type: string
      integration-atlantis-deploy:
        description: 'Whether Atlantis is deployed in this environment (INTEGRATION_ATLANTIS_DEPLOY). Set false for standby-style clusters where Atlantis is not deployed.'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner label to execute the jobs on.'
        required: false
        type: string
        default: dfds-runners
      container:
        description: 'Container image used for both the build and the apply/test job.'
        required: false
        type: string
        default: dfdsdk/prime-pipeline:latest
      aws-region:
        description: 'AWS region. Also used as the region segment of the kubeconfig path.'
        required: false
        type: string
        default: eu-west-1
    secrets:
      OP_GITHUB_TOKEN:
        description: '1Password service account token used to load environment secrets.'
        required: true

defaults:
  run:
    shell: bash

jobs:
  build_test:
    name: Build test binary from infrastructure-modules
    uses: ./.github/workflows/automation-integration-test-build.yml
    with:
      test-source-path: test/integration/suite
      repository: dfds/infrastructure-modules
      ref: master
      artifact-name: test-bin
      runner: ${{ inputs.runner }}
      container: ${{ inputs.container }}

  apply_and_test:
    name: Provision ${{ inputs.cluster-name }} & run integration tests
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container }}
    needs: build_test
    env:
      AWS_DEFAULT_REGION: ${{ inputs.aws-region }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v7

      # export-env: false keeps secrets out of the job-wide environment on a
      # public repo + self-hosted runners. Each secret is scoped, via
      # steps.op.outputs, to only the steps that need it. Note: this couples the
      # workflow to the secret names in <account-dir>/.1password — adding a new
      # secret there means adding it to the terragrunt step's env below too.
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_GITHUB_TOKEN }}
          OP_ENV_FILE: ${{ inputs.account-dir }}/.1password

      - name: Terragrunt apply and resolve kubeconfig
        env:
          ARM_CLIENT_ID: ${{ steps.op.outputs.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ steps.op.outputs.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ steps.op.outputs.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ steps.op.outputs.ARM_TENANT_ID }}
          AWS_ACCESS_KEY_ID: ${{ steps.op.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.op.outputs.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_atlantis_github_token: ${{ steps.op.outputs.TF_VAR_atlantis_github_token }}
          TF_VAR_docker_hub_password: ${{ steps.op.outputs.TF_VAR_docker_hub_password }}
          TF_VAR_docker_hub_username: ${{ steps.op.outputs.TF_VAR_docker_hub_username }}
          TF_VAR_eks_addon_awsebscsidriver_kms_arn: ${{ steps.op.outputs.TF_VAR_eks_addon_awsebscsidriver_kms_arn }}
          TF_VAR_falco_slack_alert_webhook_url: ${{ steps.op.outputs.TF_VAR_falco_slack_alert_webhook_url }}
          TF_VAR_fluxcd_bootstrap_repo_owner_token: ${{ steps.op.outputs.TF_VAR_fluxcd_bootstrap_repo_owner_token }}
          TF_VAR_onepassword_credentials_json: ${{ steps.op.outputs.TF_VAR_onepassword_credentials_json }}
          TF_VAR_onepassword_token_for_atlantis: ${{ steps.op.outputs.TF_VAR_onepassword_token_for_atlantis }}
          TF_VAR_onepassword_token_for_grafana: ${{ steps.op.outputs.TF_VAR_onepassword_token_for_grafana }}
          TF_VAR_slack_webhook_url: ${{ steps.op.outputs.TF_VAR_slack_webhook_url }}
        run: |
          terragrunt apply --all --working-dir ./${{ inputs.account-dir }} --non-interactive -input=false -auto-approve --provider-cache
          # Plain assignment (not `export ...=$(...)`) so a failed output resolution
          # fails the step under `set -e` instead of silently writing an empty KUBECONFIG.
          kubeconfig=$(terragrunt output --raw kubeconfig_path --working-dir ./${{ inputs.account-dir }}/${{ inputs.aws-region }}/k8s-${{ inputs.cluster-name }}/cluster)
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Wait for managed node groups to become active
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.op.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.op.outputs.AWS_SECRET_ACCESS_KEY }}
        run: |
            export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
                $(aws sts assume-role \
                    --role-arn ${{ inputs.prime-role-arn }} \
                    --role-session-name NgsWaitScriptSession \
                    --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
                    --output text))
            wait-for-ngs.sh ${{ inputs.cluster-name }}

      - name: Wait for auto scaling groups' instances to be in service
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.op.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.op.outputs.AWS_SECRET_ACCESS_KEY }}
        run: |
            export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
                $(aws sts assume-role \
                    --role-arn ${{ inputs.prime-role-arn }} \
                    --role-session-name AsgsWaitScriptSession \
                    --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
                    --output text))
            wait-for-asgs.sh ${{ inputs.cluster-name }}

      - name: Download test binary
        uses: actions/download-artifact@v8
        with:
          name: test-bin
          path: /tmp

      - name: Run integration tests
        env:
          INTEGRATION_DNS_ZONE: ${{ inputs.integration-dns-zone }}
          INTEGRATION_ATLANTIS_DEPLOY: ${{ inputs.integration-atlantis-deploy }}
        run: |
          chmod a+x /tmp/test.bin
          /tmp/test.bin -test.v -test.parallel 30
